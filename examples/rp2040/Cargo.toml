[package]
name = "rp2040-example"
version = "0.1.0"
edition = "2024"

[dependencies]
paa5100je-pmw3901 = { path = "../../" }

embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.9.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }

defmt = "1.0.1"
defmt-rtt = "1.1.0"

cortex-m-rt = "0.7.5"

panic-probe = { version = "1.0.0", features = ["print-defmt"] }

libm = "0.2.15"

[profile.release]
debug = 2
lto = true
opt-level = 'z'
panic = "abort"

[profile.dev]
debug = 2
lto = true
opt-level = "z"
panic = "abort"
